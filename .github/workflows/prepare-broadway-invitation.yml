name: Prepare private Broadway invitation
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Replace only the reviewed Broadway invitation, without sending email
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: broadway-private-invitation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: node scripts/check-node-version.cjs
      - run: npm ci --omit=dev
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1031252664334/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@itc-developer-502721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Check or prepare the reviewed Broadway invitation
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: itc_app
          DB_DATABASE: itc
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: 'false'
          APPLY_INVITATION: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -o /tmp/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy --port 5432 itc-developer-502721:us-east1:itc-postgres > /tmp/publications-proxy.log 2>&1 &
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 5432 && break
            sleep 1
          done
          if [ "$APPLY_INVITATION" = true ]; then
            INVITATION_SECRET="$(gcloud secrets versions access latest --secret JWT_SECRET --project itc-developer-502721)"
            echo "::add-mask::$INVITATION_SECRET"
            JWT_SECRET="$INVITATION_SECRET" node scripts/prepare-broadway-invitation.cjs --apply > /tmp/broadway-invitation-audit.json
            unset INVITATION_SECRET
          else
            node scripts/prepare-broadway-invitation.cjs > /tmp/broadway-invitation-audit.json
          fi
          cat /tmp/broadway-invitation-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: broadway-invitation-audit
          path: /tmp/broadway-invitation-audit.json
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.apply }}
        with:
          name: broadway-private-invitation
          path: /tmp/broadway-private-invitation.json
          retention-days: 1
          if-no-files-found: error
