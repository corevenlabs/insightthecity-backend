name: Deploy a Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: itc-developer-502721
  REGION: us-east1
  SERVICE: itc-backend
  REPOSITORY: itc
  SQL_INSTANCE: itc-developer-502721:us-east1:itc-postgres
  GCS_BUCKET: itc-developer-502721-media
  GCS_PRIVATE_BUCKET: itc-developer-502721-private
  FOUNDING_PARTNER_PAYMENT_LINK_MANUAL: "false"
  PARTNER_PAYMENT_LINK_TEST_MODE: "false"
  PARTNER_SERVER_CHECKOUT_ENABLED: "true"
  PARTNER_TEST_RETURN_CONFIRMATION: "false"

permissions:
  contents: read
  id-token: write # necesario para Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: node scripts/check-node-version.cjs
      - run: npm ci
      - run: npm test

      - name: Autenticar en GCP (sin claves, vía OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1031252664334/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@itc-developer-502721.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify existing Apple runtime configuration
        if: vars.APPLE_SIGN_IN_ENABLED == 'true'
        run: python3 scripts/configure-apple-secrets.py

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push de la imagen
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          docker build --pull -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker run --rm --entrypoint node "$IMAGE:${GITHUB_SHA}" scripts/check-node-version.cjs
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Migrar la base de datos
        run: |
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$SQL_INSTANCE" &
          # Esperar a que el proxy acepte conexiones.
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 5432 && break
            sleep 1
          done
          npm ci --omit=dev
          npm run db:migrate
          node scripts/restore-partner-terms-v1.js
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: itc_app
          DB_DATABASE: itc
          DB_SSL: "false"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Prepare membership sandbox only in the existing test account
        if: vars.MEMBERSHIP_SANDBOX_ENABLED == 'true' && vars.MEMBERSHIP_NORMAL_LIVE_ENABLED != 'true'
        env:
          MEMBERSHIP_SANDBOX_KEY: ${{ secrets.MEMBERSHIP_SANDBOX_KEY }}
          MEMBERSHIP_SANDBOX_WEBHOOK: ${{ secrets.MEMBERSHIP_SANDBOX_WEBHOOK }}
        run: node scripts/configure-membership-sandbox.js

      - name: Verify normal live membership without charging
        if: vars.MEMBERSHIP_NORMAL_LIVE_ENABLED == 'true'
        run: node scripts/verify-normal-membership-live.js

      - name: Verificar el secreto SMTP
        run: gcloud secrets versions access latest --secret NOREPLY_EMAIL_PASSWORD --project "$PROJECT_ID" >/dev/null

      - name: Verificar autenticación SMTP
        run: |
          SMTP_PASSWORD="$(gcloud secrets versions access latest --secret NOREPLY_EMAIL_PASSWORD --project "$PROJECT_ID")" \
          SMTP_HOST=gvam1027.siteground.biz SMTP_PORT=465 SMTP_USER=noreply@insightthecity.com \
          node scripts/verify-smtp.js

      - name: Guardar clave dedicada de socios
        if: env.PARTNER_TEST_RETURN_CONFIRMATION != 'true'
        run: node scripts/store-partner-stripe-key.js
        env:
          PARTNER_STRIPE_DEPLOY_KEY: ${{ secrets.PARTNER_STRIPE_SECRET_KEY }}
          PARTNER_STRIPE_DEPLOY_WEBHOOK: ${{ secrets.PARTNER_STRIPE_WEBHOOK_SECRET }}

      - name: Configurar enlace de Founding Partner
        run: node scripts/configure-founding-payment-link.js

      - name: Desplegar en Cloud Run
        env:
          MEMBERSHIP_NORMAL_LIVE_ENABLED: ${{ vars.MEMBERSHIP_NORMAL_LIVE_ENABLED }}
          STRIPE_WEBHOOK_SECRET_NAME: ${{ vars.STRIPE_WEBHOOK_SECRET_NAME }}
          MEMBERSHIP_SANDBOX_ENABLED: ${{ vars.MEMBERSHIP_SANDBOX_ENABLED }}
          MEMBERSHIP_CAMPAIGN_CHECKOUT: ${{ vars.MEMBERSHIP_CAMPAIGN_CHECKOUT }}
          MEMBERSHIP_LIVE_SECRETS_ATTACHED: ${{ vars.MEMBERSHIP_LIVE_SECRETS_ATTACHED }}
          MEMBERSHIP_LIVE_CONFIGURED: ${{ vars.MEMBERSHIP_LIVE_CONFIGURED }}
          MEMBERSHIP_LAUNCH_LIVE_ENABLED: ${{ vars.MEMBERSHIP_LAUNCH_LIVE_ENABLED }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          WEBHOOK_SECRET=""
          if [ -n "$STRIPE_WEBHOOK_SECRET_NAME" ]; then
            WEBHOOK_SECRET=",STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET_NAME}:latest"
          fi
          LAUNCH_ENABLED="false"
          if [ "$MEMBERSHIP_SANDBOX_ENABLED" = true ]; then
            WEBHOOK_SECRET=",STRIPE_WEBHOOK_SECRET=MEMBERSHIP_SANDBOX_WEBHOOK_SECRET:latest"
            LAUNCH_ENABLED="true"
          fi
          PUBLISHABLE_ENV=",STRIPE_PUBLISHABLE_KEY=${{ vars.MEMBERSHIP_SANDBOX_PUBLISHABLE_KEY }}"
          PUBLISHABLE_SECRET=""
          if [ "$MEMBERSHIP_NORMAL_LIVE_ENABLED" = true ]; then
            if [ "$MEMBERSHIP_SANDBOX_ENABLED" = true ]; then
              echo "Normal live membership and sandbox cannot both be enabled." >&2
              exit 1
            fi
            WEBHOOK_SECRET=",STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest"
            PUBLISHABLE_ENV=""
            PUBLISHABLE_SECRET=",STRIPE_PUBLISHABLE_KEY=MEMBERSHIP_LIVE_PUBLISHABLE_KEY:latest"
          fi
          APPLE_SECRETS=""
          APPLE_ENV=""
          if [ "${{ vars.APPLE_SIGN_IN_ENABLED }}" = true ]; then
            APPLE_SECRETS=",APPLE_PRIVATE_KEY=APPLE_PRIVATE_KEY:latest"
            APPLE_ENV=",APPLE_TEAM_ID=XKA2G7T5XX,APPLE_KEY_ID=9AMY4RRKBJ,APPLE_CLIENT_ID=com.insightthecity.app"
          fi
          CAMPAIGN_MODE="test"
          CAMPAIGN_ENABLED="false"
          CAMPAIGN_SECRETS=""
          if [ "$MEMBERSHIP_LIVE_CONFIGURED" = true ] || [ "$MEMBERSHIP_LIVE_SECRETS_ATTACHED" = true ]; then
            CAMPAIGN_SECRETS=",MEMBERSHIP_LIVE_SECRET_KEY=MEMBERSHIP_LIVE_SECRET_KEY:latest,MEMBERSHIP_LIVE_PRICE_ID=MEMBERSHIP_LIVE_PRICE_ID:latest,MEMBERSHIP_LIVE_PUBLISHABLE_KEY=MEMBERSHIP_LIVE_PUBLISHABLE_KEY:latest,MEMBERSHIP_LIVE_WEBHOOK_SECRET=MEMBERSHIP_LIVE_WEBHOOK_SECRET:latest"
          fi
          if [ "$MEMBERSHIP_LIVE_CONFIGURED" = true ]; then
            CAMPAIGN_MODE="live"
            if [ "$MEMBERSHIP_LAUNCH_LIVE_ENABLED" = true ]; then CAMPAIGN_ENABLED="true"; fi
          fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "$SQL_INSTANCE" \
            --set-env-vars "GOOGLE_WEB_CLIENT_ID=1031252664334-f6ekrsbvuq8ag340eitldmgldt9dg13d.apps.googleusercontent.com,MEMBERSHIP_CAMPAIGN_CHECKOUT=${MEMBERSHIP_CAMPAIGN_CHECKOUT},MEMBERSHIP_CAMPAIGN_MODE=${CAMPAIGN_MODE},MEMBERSHIP_LAUNCH_LIVE_ENABLED=${CAMPAIGN_ENABLED}${PUBLISHABLE_ENV},MEMBERSHIP_LAUNCH_TEST_ENABLED=${LAUNCH_ENABLED},PARTNER_SERVER_CHECKOUT_ENABLED=${PARTNER_SERVER_CHECKOUT_ENABLED},PARTNER_PAYMENT_LINK_TEST_MODE=${PARTNER_PAYMENT_LINK_TEST_MODE},FOUNDING_PARTNER_PAYMENT_LINK_MANUAL=${FOUNDING_PARTNER_PAYMENT_LINK_MANUAL},FOUNDING_PARTNER_PAYMENT_LINK_ID=${FOUNDING_PARTNER_PAYMENT_LINK_ID},STRATEGIC_PARTNER_PAYMENT_LINK_ID=${STRATEGIC_PARTNER_PAYMENT_LINK_ID},DB_HOST=/cloudsql/${SQL_INSTANCE},DB_USER=itc_app,DB_DATABASE=itc,DB_SSL=false,UPLOAD_DRIVER=gcs,GCS_BUCKET=${GCS_BUCKET},GCS_PRIVATE_BUCKET=${GCS_PRIVATE_BUCKET},GCS_PROJECT_ID=${PROJECT_ID},SMTP_HOST=gvam1027.siteground.biz,SMTP_PORT=465,SMTP_USER=noreply@insightthecity.com,PASSWORD_RESET_FROM=ITC Club <noreply@insightthecity.com>,PANEL_PUBLIC_URL=https://itc-panel-1031252664334.us-east1.run.app,PUBLIC_BASE_URL=https://itc-backend-1031252664334.us-east1.run.app${APPLE_ENV}" \
            --set-secrets "DB_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_PRICE_ID=STRIPE_PRICE_ID:latest,GOOGLE_PLACES_API_KEY=GOOGLE_PLACES_API_KEY:latest,SMTP_PASSWORD=NOREPLY_EMAIL_PASSWORD:latest${FOUNDING_PARTNER_SECRET_BINDINGS}${WEBHOOK_SECRET}${CAMPAIGN_SECRETS}${PUBLISHABLE_SECRET}${APPLE_SECRETS}" \
            --min-instances 0 \
            --max-instances 4 \
            --memory 512Mi

      - name: Configurar retorno del enlace Founding Partner
        run: node scripts/configure-founding-payment-link.js
        env:
          FOUNDING_FINALIZE: "true"

      - name: Mostrar la URL del servicio
        run: gcloud run services describe "$SERVICE" --region "$REGION" --format="value(status.url)"

      - name: Verify Apple runtime after deployment
        if: vars.APPLE_SIGN_IN_ENABLED == 'true'
        run: python3 scripts/verify-apple-deployment.py
