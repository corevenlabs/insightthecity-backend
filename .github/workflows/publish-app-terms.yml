name: Publish approved English app terms
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1031252664334/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@itc-developer-502721.iam.gserviceaccount.com
      - name: Publish approved document
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: itc_app
          DB_DATABASE: itc
          DB_SSL: 'false'
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          curl --fail --silent --show-error --location -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 itc-developer-502721:us-east1:itc-postgres &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID"' EXIT
          for attempt in $(seq 1 30); do
            nc -z 127.0.0.1 5432 && break
            sleep 1
          done
          npm ci --omit=dev
          node scripts/publish-app-terms.js
