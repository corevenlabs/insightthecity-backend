name: Verify Apple production (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1031252664334/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@itc-developer-502721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Check existing deployment and Apple startup logs
        run: python3 scripts/verify-apple-deployment.py
        env:
          PROJECT_ID: itc-developer-502721
          REGION: us-east1
          SERVICE: itc-backend
      - name: Review authentication errors and read-only HTTP checks
        run: python3 scripts/audit-apple-production.py
