name: Migrate user avatars to private storage
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Copy avatars privately and remove their public originals
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: migrate-private-avatars
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1031252664334/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@itc-developer-502721.iam.gserviceaccount.com
      - run: npm ci --omit=dev
      - name: Connect to database and migrate avatars
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: itc_app
          DB_DATABASE: itc
          DB_SSL: 'false'
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          UPLOAD_DRIVER: gcs
          GCS_BUCKET: itc-developer-502721-media
          APPLY_MIGRATION: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          curl -fsSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 itc-developer-502721:us-east1:itc-postgres &
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 5432 && break
            sleep 1
          done
          if [ "$APPLY_MIGRATION" = true ]; then
            node scripts/migrate-private-avatars.js --apply
          else
            node scripts/migrate-private-avatars.js
          fi
