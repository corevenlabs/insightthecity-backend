name: Audit staff access (read only)
on:
  workflow_dispatch:
    inputs:
      email:
        description: Staff email to inspect
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1031252664334/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@itc-developer-502721.iam.gserviceaccount.com
      - run: npm ci --omit=dev
      - name: Inspect account and assigned client states without changes
        env:
          AUDIT_STAFF_EMAIL: ${{ inputs.email }}
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: itc_app
          DB_DATABASE: itc
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: 'false'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -o /tmp/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy --port 5432 itc-developer-502721:us-east1:itc-postgres > /tmp/staff-audit-proxy.log 2>&1 &
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 5432 && break
            sleep 1
          done
          node scripts/audit-staff-access.cjs
