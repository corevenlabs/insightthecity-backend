name: Send individual membership launch test invitation
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: membership-launch-test-invite
  cancel-in-progress: false
jobs:
  invite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1031252664334/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@itc-developer-502721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm ci --omit=dev
      - name: Send single sandbox invitation
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: itc_app
          DB_DATABASE: itc
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MEMBERSHIP_LAUNCH_TEST_ENABLED: 'true'
          STRIPE_SECRET_KEY: ${{ secrets.MEMBERSHIP_SANDBOX_KEY }}
          SMTP_HOST: gvam1027.siteground.biz
          SMTP_PORT: '465'
          SMTP_USER: noreply@insightthecity.com
          PASSWORD_RESET_FROM: ITC Club <noreply@insightthecity.com>
        run: |
          set -euo pipefail
          JWT_SECRET="$(gcloud secrets versions access latest --secret=JWT_SECRET --project=itc-developer-502721)"
          SMTP_PASSWORD="$(gcloud secrets versions access latest --secret=NOREPLY_EMAIL_PASSWORD --project=itc-developer-502721)"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$SMTP_PASSWORD"
          export JWT_SECRET SMTP_PASSWORD
          curl -fsSL -o /tmp/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy --port 5432 itc-developer-502721:us-east1:itc-postgres &
          for i in $(seq 1 30); do nc -z 127.0.0.1 5432 && break; sleep 1; done
          node scripts/send-membership-launch-test.js
