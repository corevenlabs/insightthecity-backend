name: Optimize experience images
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run reports only; apply writes resized copies and switches URLs; rollback restores the original URLs
        type: choice
        options: [dry-run, apply, rollback]
        default: dry-run
      map:
        description: For rollback only, the map key printed by apply (experiences/optimized/_maps/...json)
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: optimize-experience-images
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1031252664334/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@itc-developer-502721.iam.gserviceaccount.com
      - run: node scripts/check-node-version.cjs
      - run: npm ci --omit=dev
      - name: Connect to database and optimize images
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: itc_app
          DB_DATABASE: itc
          DB_SSL: 'false'
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          UPLOAD_DRIVER: gcs
          GCS_BUCKET: itc-developer-502721-media
          MODE: ${{ inputs.mode }}
          MAP_KEY: ${{ inputs.map }}
        run: |
          curl --fail --silent --show-error --location -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 itc-developer-502721:us-east1:itc-postgres &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID"' EXIT
          for attempt in $(seq 1 30); do
            nc -z 127.0.0.1 5432 && break
            sleep 1
          done
          case "$MODE" in
            apply) node scripts/optimize-experience-images.js --apply ;;
            rollback) node scripts/optimize-experience-images.js --rollback "$MAP_KEY" ;;
            *) node scripts/optimize-experience-images.js ;;
          esac
